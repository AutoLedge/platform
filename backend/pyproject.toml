[project]
name = "autoledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebastian Vega", email = "sebasvega4604@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.142.2",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
dev = "autoledge.cli:dev"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]
# Autogenerated migrations are never reformatted (README: never edit a merged migration).
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["autoledge"]
